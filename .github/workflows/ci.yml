name: CI

# Automated hosted runs disabled: CI runs locally on developer machine via scripts/ci.sh.
on:
  workflow_dispatch:

permissions: {}

jobs:
  api-checks:
    name: API (NestJS + Prisma)
    runs-on: ubuntu-latest
    permissions: {}
    if: false # Restricted: Hosted runner disabled. Run locally via `pnpm run ci:local` or `bash scripts/ci.sh`.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
        with:
          version: 9.15.9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api run lint --if-present

      - name: Run API Unit Tests
        run: pnpm --filter api test --if-present

  flutter-checks:
    name: Flutter & Dart Packages
    runs-on: ubuntu-latest
    permissions: {}
    if: false # Restricted: Hosted runner disabled. Run locally via `scripts/ci.sh`.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Check Dart Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Packages
        run: |
          for pkg in packages/grs_core packages/grs_ui apps/mobile apps/dashboard; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "Analyzing $pkg..."
              (cd "$pkg" && flutter pub get && flutter analyze)
            fi
          done

      - name: Run Dart/Flutter Tests
        run: |
          for pkg in packages/grs_core packages/grs_ui apps/mobile apps/dashboard; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "Testing $pkg..."
              (cd "$pkg" && flutter test --no-pub)
            fi
          done

      - name: Verify Trilingual l10n Key Parity (M2.3)
        run: (cd apps/mobile && flutter test test/l10n_test.dart)

  security-checks:
    name: Security & Permissions Verification
    runs-on: ubuntu-latest
    permissions: {}
    if: false # Restricted: Hosted runner disabled. Run locally via `scripts/ci.sh`.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Android Manifest Permissions (Invariant 7)
        run: |
          if [ -f "apps/mobile/android/app/src/main/AndroidManifest.xml" ]; then
            # Ensure only authorized permissions exist
            DISALLOWED=$(grep "uses-permission" apps/mobile/android/app/src/main/AndroidManifest.xml | \
              grep -v "android.permission.INTERNET" | \
              grep -v "android.permission.ACCESS_NETWORK_STATE" | \
              grep -v "android.permission.RECEIVE_BOOT_COMPLETED" | \
              grep -v "android.permission.REQUEST_INSTALL_PACKAGES" || true)
            if [ -n "$DISALLOWED" ]; then
              echo "FATAL: Unauthorized Android permissions found:"
              echo "$DISALLOWED"
              exit 1
            fi
            echo "Android Manifest permissions verified: Only INTERNET, ACCESS_NETWORK_STATE, and BOOT permitted."
          fi

      - name: Secret Scan Client Builds (Invariant 5)
        run: |
          # Ensure no service-role key or JWT private secrets leak into apps or packages
          LEAKS=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY" apps/mobile apps/dashboard packages/ 2>/dev/null || true)
          if [ -n "$LEAKS" ]; then
            echo "FATAL: Service role key found in client source code!"
            echo "$LEAKS"
            exit 1
          fi
          echo "Client bundle secret scan passed."
