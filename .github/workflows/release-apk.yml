name: Release APK

# Automated hosted runs disabled: release APK builds are produced locally or on private runner.
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    if: false # Restricted: Hosted runner disabled.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'

      - name: Build APK
        run: |
          if [ -d "apps/mobile" ]; then
            cd apps/mobile
            flutter pub get
            flutter build apk --release
            sha256sum build/app/outputs/flutter-apk/app-release.apk > checksum.txt
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grs-android-release-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/checksum.txt
