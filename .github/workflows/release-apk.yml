name: Build & Release APK (OTA Updates)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      min_supported_version:
        description: 'Minimum supported client version'
        required: false
        default: '1.0.0'
      release_notes:
        description: 'Release changelog notes'
        required: false
        default: 'Security hardening, in-app updates, and offline sync optimizations.'
      mandatory:
        description: 'Is update mandatory (blocks older versions)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Determine Version & Tag
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "TAG=${RAW_TAG}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          cd packages/grs_core && flutter pub get
          cd ../grs_ui && flutter pub get
          cd ../../apps/mobile && flutter pub get

      - name: Build Android Release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Generate Checksum & Release Manifest
        id: manifest
        run: |
          APK_PATH="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          FILE_SIZE=$(wc -c < "$APK_PATH")
          
          echo "SHA256=${SHA256}" >> $GITHUB_ENV
          echo "FILE_SIZE=${FILE_SIZE}" >> $GITHUB_ENV
          echo "${SHA256}  app-release.apk" > checksum.txt

          cat <<EOF > manifest.json
          {
            "version": "${VERSION}",
            "buildNumber": ${{ github.run_number }},
            "minSupportedVersion": "${{ github.event.inputs.min_supported_version || '1.0.0' }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk",
            "sha256": "${SHA256}",
            "checksum": "${SHA256}",
            "fileSize": ${FILE_SIZE},
            "releaseNotes": "${{ github.event.inputs.release_notes || 'Security hardening, in-app updates, and offline sync optimizations.' }}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": ${{ github.event.inputs.mandatory || false }}
          }
          EOF

          echo "Generated manifest.json:"
          cat manifest.json

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: |
            ## GRS Mobile Release ${{ env.TAG }}
            
            ${{ github.event.inputs.release_notes || 'Automated release build.' }}
            
            ### Artifact Verification
            - **Binary:** `app-release.apk`
            - **SHA-256:** `${{ env.SHA256 }}`
            - **Size:** `${{ env.FILE_SIZE }} bytes`
            - **Minimum Supported Version:** `${{ github.event.inputs.min_supported_version || '1.0.0' }}`
          files: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            manifest.json
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify NestJS Backend (Optional)
        if: env.BACKEND_URL != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          curl -s -X POST "${BACKEND_URL}/v1/releases" \
            -H "Content-Type: application/json" \
            -H "X-Release-Secret: ${RELEASE_SECRET}" \
            -d @manifest.json || echo "Backend release sync skipped or failed"
